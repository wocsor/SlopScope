name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARM_CLANG: clang-18
      ARM_LD_LLD: ld.lld-18
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Select release version
        id: version
        run: |
          python - <<'PY'
          import os, re
          branch = os.environ['GITHUB_REF_NAME']
          tag, updater = '', 'VSlopScope-0.1'
          if os.environ['GITHUB_REF'].startswith('refs/heads/release/'):
              version = branch.removeprefix('release/')
              if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version):
                  raise SystemExit('Use a release/X.Y.Z or release/X.Y.Z-rc.1 branch')
              tag, updater = 'v' + version, 'V' + version
              if len(updater) > 15:
                  raise SystemExit('Release version exceeds the stock updater 15-character field')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'release_tag={tag}\nupdater_version={updater}\n')
          PY
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 lld-18
          python -m pip install -r requirements.txt
      - name: Build the cold-boot application
        run: python -B tools/build.py
      - name: Package the FEL binary and stock updater file
        env:
          UPDATER_VERSION: ${{ steps.version.outputs.updater_version }}
        run: python -B tools/package_update.py --version "$UPDATER_VERSION"
      - name: Collect release artifacts
        run: |
          mkdir -p build/release
          cp build/cold/scope.elf build/cold/manifest.json build/release/
          cp build/update/SlopScope-fel.bin build/update/Scope.update build/update/update-manifest.json build/release/
          cp LICENSE THIRD_PARTY_NOTICES.md build/release/
          cp docs/flashing.md docs/status.md build/release/
          python -m pip freeze > build/release/build-dependencies.txt
          clang-18 --version > build/release/toolchain.txt
          ld.lld-18 --version >> build/release/toolchain.txt
          printf '%s\n' "$GITHUB_SHA" > build/release/source-commit.txt
          cd build/release
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SlopScope-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/release/')
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.firmware.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SlopScope-${{ github.sha }}
          path: build/release
      - name: Publish release with verified build assets
        run: >-
          python3 tools/publish_release.py
          --repository "$GH_REPO"
          --tag "$RELEASE_TAG"
          --commit "$GITHUB_SHA"
          --assets-dir build/release
